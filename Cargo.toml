[package]
name = "jefetch"
version = "0.1.0"
edition = "2021"
description = "A fastfetch clone written in pure Rust, statically linked against musl"
license = "MIT"

[dependencies]
libc = "0.2"
# Image logos (type = "image"): decode only, no encoders, no rayon.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "qoi", "tga"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
