[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-arg=-static", "-C", "link-arg=-zstack-size=2097152", "-C", "relocation-model=static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-arg=-static", "-C", "link-arg=-zstack-size=2097152", "-C", "relocation-model=static"]

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "link-arg=-static", "-C", "link-arg=-zstack-size=2097152", "-C", "relocation-model=static"]
